# Render deployment for the API + worker. Free-first: the web app deploys
# separately to Vercel (see vercel.json); Postgres and Redis can be Render's
# free-tier managed services or an external provider (e.g. Supabase for Postgres).
services:
  - type: web
    name: gruvle-reach-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: gruvle-reach-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: SEARXNG_BASE_URL
        sync: false
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false

  - type: worker
    name: gruvle-reach-worker
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    dockerCommand: celery -A app.workers.celery_app worker --beat --loglevel=info
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: gruvle-reach-redis
          property: connectionString
      - key: SECRET_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false

  - type: redis
    name: gruvle-reach-redis
    plan: free
    ipAllowList: []
