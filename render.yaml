# Render deployment for the API. Free-first: the web app deploys separately
# to Vercel (see vercel.json); Postgres is Supabase (see CLAUDE.md). Scheduled
# jobs (previously a `type: worker` running Celery beat — Render's free plan
# rejects that service type) now run via the secured /cron/* endpoints below,
# triggered by GitHub Actions cron (.github/workflows/scheduled-tasks.yml).
services:
  - type: web
    name: gruvle-reach-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: SEARXNG_BASE_URL
        sync: false
      - key: AI_PROVIDER
        value: chain
      - key: GROQ_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
